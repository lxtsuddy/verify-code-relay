# verify-code-relay YAML 設定範例：只供 `relay config import` 一次匯入（及匯入前的
# `relay config validate`）使用。服務執行時不讀這個檔案，設定存在資料庫，平常請在
# Web 管理介面修改；`relay config export` 可把目前設定匯出成同樣格式備份。
# 機密資料可用 ${環境變數} 帶入，匯入時從執行 import 的環境展開後存進資料庫。

log_level: info              # debug | info | warn | error

bots:
  main: { token: "${TG_BOT_MAIN}" }
  work: { token: "${TG_BOT_WORK}" }

targets:                     # 目標 = Bot + 聊天室；chat_id 可在 Web 的 Telegram 頁「讀取最近對話」取得
  me:        { bot: main, chat_id: 123456789 }
  family:    { bot: main, chat_id: -1001234567890 }
  work_chan: { bot: work, chat_id: -1009876543210 }

admin: me                    # 選填：系統告警（斷線、授權失效、發送失敗）送到這個目標

defaults:
  max_age: 10m               # 收信時間超過多久就不轉發
  ttl: 15m                   # 待發送訊息超過多久就丟棄
  alert_ttl: 24h             # 告警訊息在佇列中保留多久
  poll_interval: 30s         # 伺服器不支援 IDLE 時的輪詢間隔
  alert_after: 10m           # 連續斷線多久才告警

microsoft:                   # 選填：Microsoft 信箱共用的 Azure 應用程式（Web：系統設定 → Microsoft 應用程式）
  client_id: "00000000-0000-0000-0000-000000000000"   # 見 README「信箱設定 → Microsoft」
  tenant: consumers          # 個人帳號 consumers；公司帳號 organizations 或租戶 ID；省略為 common

mailboxes:
  personal_gmail:
    display_name: 個人 Gmail
    host: imap.gmail.com
    username: me@gmail.com
    auth: { type: password, password: "${GMAIL_APP_PASSWORD}" }   # Google 帳戶 → 安全性 → 應用程式密碼
    folders: [INBOX, "[Gmail]/Spam"]   # 監看垃圾郵件匣需在 Gmail 標籤設定勾選「在 IMAP 中顯示」
    targets: [me]

  outlook:
    display_name: Outlook
    host: outlook.office365.com
    username: me@outlook.com
    auth:
      type: microsoft_oauth  # 沿用上面 microsoft 的 client_id 與 tenant；匯入後在 Web 的信箱頁授權
      # client_id: "…"       # 選填：只有這個信箱要用別的 Azure 應用程式時才寫（tenant 同理）
    targets: [me, work_chan]
    max_age: 5m
    templates:
      code: |
        💼 <b>{{.Service}}</b>：<code>{{.Code}}</code>
        📧 {{.Mailbox}}{{with .Subject}} · {{.}}{{end}}

# 全域範本（選填）。可用變數：.Code .URL .Service .FromName .FromAddr .To .Subject .Mailbox .Date .Rule
# templates:
#   code: |
#     🔐 <b>{{.Service}}</b> 驗證碼
#     <code>{{.Code}}</code>

rules:
  - name: ignore-newsletters
    from: "*@news.example.com"
    ignore: true
  # - name: github
  #   from: "*@github.com"
  #   code_regex: 'code:\s*(\d{6})'

recognize:
  extra_code_keywords: []
  extra_link_keywords: []
