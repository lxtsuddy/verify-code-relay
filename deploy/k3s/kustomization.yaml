# 部署：kubectl apply -k deploy/k3s
# 部署前先準備 secret.env（不進 git）：
#   cp .env.example deploy/k3s/secret.env   # 填入 RELAY_ADMIN_PASSWORD
# 並把 ingress.yaml 的 host 改成你的網域。其餘設定全部在 Web 管理介面完成。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: verify-code-relay

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# secret.env 只需要 RELAY_ADMIN_PASSWORD（至少 12 字元，部署後請立即登入綁定 TOTP）。
# 只在資料庫還沒有管理員時使用；之後改密碼請在 Web 的系統設定進行。
# 名稱會加上內容雜湊：修改 secret.env 後重新 apply，Pod 會自動重啟。
secretGenerator:
  - name: relay-secrets
    envs:
      - secret.env

# 改成你推送的映像位置與版本。
images:
  - name: verify-code-relay
    newName: ghcr.io/lxtsuddy/verify-code-relay
    newTag: "0.2.6"

labels:
  - pairs:
      app.kubernetes.io/name: verify-code-relay
    includeSelectors: true
