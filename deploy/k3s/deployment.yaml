apiVersion: apps/v1
kind: Deployment
metadata:
  name: verify-code-relay
spec:
  # 只能有一個實例：SQLite 不能由兩個 Pod 同時寫入，兩個實例也會重複轉發。
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: verify-code-relay
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            # 選配：K3s 預設 Pod 網段，Traefik 由此網段轉送請求。再加上 Caddy 的 IP
            # （以逗號分隔），並讓 Traefik 信任 Caddy 的 X-Forwarded-For（見 docs/deploy.md），
            # 登入通知與紀錄中才會是真實的用戶端 IP。只影響記錄，不影響安全判斷。
            - name: RELAY_TRUSTED_PROXIES
              value: "10.42.0.0/16"
          # secret.env 的 RELAY_ADMIN_PASSWORD：只在資料庫還沒有管理員時使用。
          envFrom:
            - secretRef:
                name: relay-secrets
          ports:
            - name: http # Web 管理介面，經 Service／Ingress 對外
              containerPort: 8080
            - name: health # 健康檢查，只給探針使用，不經 Service 暴露
              containerPort: 8081
          # /readyz 只確認服務與資料庫正常，不看信箱狀態：Outlook 需要重新授權或信箱斷線時
          # Web 仍可連線，才能在網頁上處理。信箱問題由 Telegram 告警與總覽頁呈現。
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 15
            failureThreshold: 2
          # 只確認程序還活著；重啟無法修復信箱的連線或授權問題。
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relay-data
        - name: tmp
          emptyDir: {}
